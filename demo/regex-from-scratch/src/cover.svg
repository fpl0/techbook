<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title">
  <title id="cover-title">The pattern (a|b)*c as a Thompson machine: a split state fans out to a and b, both loop back, and c leads to match</title>
  <defs>
    <marker id="arrow-cover" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dia-muted)"/>
    </marker>
  </defs>
  <g font-family="var(--font-code)" font-size="22" fill="var(--dia-muted)" text-anchor="middle">
    <text x="400" y="30">( a | b ) * c</text>
  </g>
  <!-- states -->
  <g fill="var(--dia-fill)" stroke="var(--dia-fg)" stroke-width="1.5">
    <circle cx="104" cy="184" r="28"/>
    <circle cx="256" cy="184" r="28"/>
    <circle cx="408" cy="112" r="28"/>
    <circle cx="408" cy="256" r="28"/>
    <circle cx="560" cy="184" r="28"/>
  </g>
  <circle cx="712" cy="184" r="28" fill="var(--dia-fill)" stroke="var(--dia-accent)" stroke-width="2.5"/>
  <circle cx="712" cy="184" r="20" fill="none" stroke="var(--dia-accent)" stroke-width="1.5"/>
  <!-- labels -->
  <g font-family="var(--font-ui)" font-size="14" fill="var(--dia-fg)" text-anchor="middle" dominant-baseline="middle">
    <text x="104" y="184">start</text>
    <text x="256" y="184">split</text>
    <text x="408" y="112" font-family="var(--font-code)" font-size="16">a</text>
    <text x="408" y="256" font-family="var(--font-code)" font-size="16">b</text>
    <text x="560" y="184" font-family="var(--font-code)" font-size="16">c</text>
    <text x="712" y="184">match</text>
  </g>
  <!-- edges -->
  <g stroke="var(--dia-muted)" stroke-width="1.5" fill="none" marker-end="url(#arrow-cover)">
    <path d="M 132 184 L 222 184"/>
    <path d="M 276 164 L 380 120"/>
    <path d="M 276 204 L 380 248"/>
    <path d="M 284 184 L 526 184"/>
    <path d="M 588 184 L 678 184"/>
  </g>
  <!-- loops back to split -->
  <g stroke="var(--dia-accent)" stroke-width="1.5" fill="none" marker-end="url(#arrow-cover)">
    <path d="M 424 88 C 440 40, 232 40, 248 152"/>
    <path d="M 424 280 C 440 328, 232 328, 248 216"/>
  </g>
  <g font-family="var(--font-ui)" font-size="13" fill="var(--dia-accent)" text-anchor="middle">
    <text x="336" y="70">both, at once</text>
    <text x="336" y="316">and again</text>
  </g>
</svg>
